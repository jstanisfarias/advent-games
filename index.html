body {
 font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
 background: linear-gradient(#0b1b2b, #12263c);
 color: #f5f5f5;
 margin: 0;
 padding: 0;
}
header {
 text-align: center;
 padding: 20px;
 background: #1a304a;
 border-bottom: 2px solid #c62828; /* holiday red accent */
}
h1 {
 margin: 0;
 font-size: 1.9rem;
 color: #ffebee; /* soft holiday pink */
}
.day-btn {
 background: #243b57;
 border: 2px solid #c62828; /* holiday red border */
 color: #f5f5f5;
 padding: 10px 14px;
 border-radius: 6px;
 cursor: pointer;
 font-size: 0.9rem;
}
.day-btn:hover {
 background: #33527a;
 border-color: #ffccbc; /* warm holiday glow */
}
.content {
 max-width: 800px;
 margin: 0 auto;
 padding: 16px 20px 40px;
 background: rgba(18, 38, 60, 0.85);
 border-top: 2px solid #c62828;
 border-radius: 8px;
}
.section-title {
 font-weight: 600;
 margin-top: 16px;
 margin-bottom: 6px;
 font-size: 1rem;
 color: #ffccbc; /* warm holiday accent */
}
.card {
 background: #1a304a;
 padding: 10px 12px;
 border-radius: 6px;
 margin-bottom: 10px;
 font-size: 0.9rem;
 border-left: 4px solid #c62828; /* holiday stripe */
}

#snow {
 position: fixed;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 pointer-events: none;
 overflow: hidden;
}
.snowflake {
 position: absolute;
 top: -10px;
 color: white;
 font-size: 1rem;
 opacity: 0.8;
 animation: fall linear infinite;
}
@keyframes fall {
 0% { transform: translateY(0); }
 100% { transform: translateY(100vh); }
}

/* Candy‑cane border for cards */
.card {
 background: #1a304a;
 padding: 10px 12px;
 border-radius: 8px;
 margin-bottom: 10px;
 font-size: 0.9rem;
 border: 4px solid transparent;
 background-image:
   linear-gradient(#1a304a, #1a304a),
   repeating-linear-gradient(
     45deg,
     #c62828 0px,
     #c62828 6px,
     #ffffff 6px,
     #ffffff 12px
   );
 background-origin: border-box;
 background-clip: padding-box, border-box;
}
/* Gold glow around main content */
.content {
 border: 2px solid #ffd700;
 box-shadow: 0 0 12px #ffd700;
 border-radius: 10px;
}
/* Holiday outline for buttons */
.day-btn {
 border: 2px solid #ffd700;
 box-shadow: 0 0 6px #ffd700;
}

/* Holiday Light String */

.light-string {

  display: flex;

  justify-content: center;

  gap: 14px;

  padding: 12px 0;

  background: transparent;

  margin-bottom: 10px;

}

.bulb {

  width: 18px;

  height: 28px;

  border-radius: 50% 50% 45% 45%;

  display: inline-block;

  animation: glow 1.8s infinite ease-in-out;

  box-shadow: 0 0 6px rgba(255,255,255,0.6);

}

.bulb.red {

  background: #ff4d4d;

  animation-delay: 0s;

}

.bulb.gold {

  background: #ffd700;

  animation-delay: 0.3s;

}

.bulb.green {

  background: #4caf50;

  animation-delay: 0.6s;

}

.bulb.blue {

  background: #64b5f6;

  animation-delay: 0.9s;

}

@keyframes glow {

  0% { opacity: 0.4; transform: scale(0.95); }

  50% { opacity: 1; transform: scale(1.1); }

  100% { opacity: 0.4; transform: scale(0.95); }

}

/* Interactive Wordle layout */
.wordle-layout {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 28px;
  margin-top: 20px;
  flex-wrap: wrap;
}

#wordle-game {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#wordle-grid {
  display: grid;
  grid-template-columns: repeat(5, 52px);
  grid-template-rows: repeat(6, 52px);
  gap: 6px;
}

.wordle-tile {
  width: 52px;
  height: 52px;
  box-sizing: border-box;
  background: #12263c;
  border: 2px solid #5b6f84;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.55rem;
  font-weight: 700;
  color: #ffffff;
  text-transform: uppercase;
  border-radius: 5px;
  transition:
    background-color 0.2s ease,
    border-color 0.2s ease,
    transform 0.15s ease;
}

.wordle-tile.filled {
  border-color: #a8b3bf;
  transform: scale(1.03);
}

.wordle-tile.wordle-correct {
  background: #538d4e;
  border-color: #538d4e;
  color: #ffffff;
}

.wordle-tile.wordle-present {
  background: #b59f3b;
  border-color: #b59f3b;
  color: #ffffff;
}

.wordle-tile.wordle-absent {
  background: #3a3a3c;
  border-color: #3a3a3c;
  color: #ffffff;
}

#wordle-message {
  min-height: 24px;
  margin-top: 12px;
  text-align: center;
  font-size: 0.95rem;
  font-weight: 600;
  color: #ffebee;
}

.wordle-instructions {
  margin: 0 0 12px;
  text-align: center;
  font-size: 0.85rem;
  opacity: 0.9;
}

/* Alphabet keyboard */
#wordle-keyboard {
  display: flex;
  flex-direction: column;
  gap: 7px;
  align-items: center;
}

.keyboard-title {
  margin-bottom: 4px;
  font-size: 0.9rem;
  font-weight: 700;
  color: #ffccbc;
}

.keyboard-row {
  display: flex;
  justify-content: center;
  gap: 5px;
}

.wordle-key {
  min-width: 34px;
  height: 44px;
  padding: 0 7px;
  border: none;
  border-radius: 5px;
  background: #5b6f84;
  color: #ffffff;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  text-transform: uppercase;
  transition:
    background-color 0.2s ease,
    opacity 0.2s ease,
    transform 0.1s ease;
}

.wordle-key:hover {
  transform: translateY(-1px);
  background: #71879e;
}

.wordle-key:focus-visible {
  outline: 3px solid #ffd700;
  outline-offset: 2px;
}

.wordle-key.wide-key {
  min-width: 64px;
  font-size: 0.75rem;
}

/* Letter was guessed and is not in the word */
.wordle-key.key-absent {
  background: #34383d;
  color: #9da3aa;
  opacity: 0.65;
  font-weight: 400;
}

/* Letter is in the word but in the wrong position */
.wordle-key.key-present {
  background: #b59f3b;
  color: #ffffff;
  font-weight: 800;
  opacity: 1;
}

/* Letter is in the correct position */
.wordle-key.key-correct {
  background: #538d4e;
  color: #ffffff;
  font-weight: 800;
  opacity: 1;
}

@media (max-width: 700px) {
  .wordle-layout {
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  #wordle-grid {
    grid-template-columns: repeat(5, 46px);
    grid-template-rows: repeat(6, 46px);
  }

  .wordle-tile {
    width: 46px;
    height: 46px;
    font-size: 1.3rem;
  }

  .wordle-key {
    min-width: 28px;
    height: 40px;
    padding: 0 5px;
    font-size: 0.8rem;
  }

  .wordle-key.wide-key {
    min-width: 54px;
    font-size: 0.68rem;
  }
}

.trivia-chain {
  margin-top: 20px;
}

.trivia-chain .card {
  margin-bottom: 16px;
}

.trivia-chain details {
  margin-top: 6px;
  margin-bottom: 6px;
}

.trivia-chain summary {
  cursor: pointer;
  font-weight: 600;
  color: #ffccbc;
}

/* Interactive Connections game */

#connections-container {
  margin-top: 20px;
}

.connections-heading {
  margin-bottom: 16px;
  text-align: center;
}

.connections-heading h3 {
  margin-bottom: 6px;
  color: #ffccbc;
}

.connections-heading p {
  margin: 0;
  font-size: 0.9rem;
  line-height: 1.5;
  opacity: 0.9;
}

#connections-solved {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
}

.connections-solved-group {
  padding: 14px 12px;
  border-radius: 8px;
  color: #111111;
  text-align: center;
  animation: connectionsReveal 0.35s ease;
}

.connections-solved-category {
  margin-bottom: 5px;
  font-size: 0.95rem;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.connections-solved-words {
  font-size: 0.86rem;
  font-weight: 700;
  line-height: 1.4;
}

.connections-yellow {
  background: #f9df6d;
}

.connections-green {
  background: #a0c35a;
}

.connections-blue {
  background: #b0c4ef;
}

.connections-purple {
  background: #ba81c5;
}

.connections-revealed {
  opacity: 0.82;
}

#connections-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.connections-word {
  min-height: 74px;
  padding: 8px 5px;
  border: 2px solid transparent;
  border-radius: 7px;
  background: #e8e6dc;
  color: #111111;
  font-family: inherit;
  font-size: clamp(0.66rem, 1.7vw, 0.88rem);
  font-weight: 800;
  line-height: 1.15;
  text-align: center;
  text-transform: uppercase;
  cursor: pointer;
  overflow-wrap: anywhere;
  transition:
    background-color 0.15s ease,
    color 0.15s ease,
    transform 0.12s ease,
    border-color 0.15s ease;
}

.connections-word:hover:not(:disabled) {
  transform: translateY(-2px);
  border-color: #ffd700;
}

.connections-word.selected {
  background: #5a594e;
  color: #ffffff;
  border-color: #ffd700;
  transform: scale(0.97);
}

.connections-word:focus-visible {
  outline: 3px solid #ffd700;
  outline-offset: 2px;
}

#connections-message {
  min-height: 28px;
  margin: 13px 0 5px;
  color: #ffffff;
  font-size: 0.94rem;
  font-weight: 800;
  text-align: center;
}

.connections-message-close {
  color: #ffd54f;
}

.connections-message-success {
  color: #b8e6b8;
}

.connections-message-error {
  color: #ffb3b3;
}

.connections-mistakes {
  margin: 8px 0 12px;
  text-align: center;
  font-size: 0.9rem;
}

#connections-mistake-dots {
  display: inline-flex;
  gap: 6px;
  margin-left: 7px;
  vertical-align: middle;
}

.connections-mistake-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffd700;
  box-shadow: 0 0 4px rgba(255, 215, 0, 0.6);
}

.connections-controls {
  display: flex;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
}

.connections-control-btn {
  padding: 8px 13px;
  border: 1px solid #ffd700;
  border-radius: 20px;
  background: #243b57;
  color: #ffffff;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
}

.connections-control-btn:hover:not(:disabled) {
  background: #33527a;
}

.connections-control-btn.submit {
  background: #c62828;
}

.connections-control-btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

@keyframes connectionsReveal {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 600px) {
  #connections-grid {
    gap: 5px;
  }

  .connections-word {
    min-height: 62px;
    padding: 6px 3px;
    font-size: clamp(0.55rem, 2.7vw, 0.73rem);
  }
}

/* Interactive mini crossword */
.crossword-instructions {
  margin: 18px 0 12px;
  text-align: center;
  font-size: 0.88rem;
  line-height: 1.5;
  opacity: 0.9;
}

#crossword-container {
  width: 100%;
  overflow-x: auto;
  padding-bottom: 10px;
}

.crossword-layout {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 28px;
  flex-wrap: wrap;
  margin-top: 15px;
}

.crossword-board-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 100%;
}

#crossword-grid {
  --crossword-size: 5;
  --crossword-cell-size: clamp(24px, 2.3vw, 30px);

  display: grid;
  grid-template-columns:
    repeat(
      var(--crossword-size),
      var(--crossword-cell-size)
    );
  grid-template-rows:
    repeat(
      var(--crossword-size),
      var(--crossword-cell-size)
    );

  gap: 1px;
  padding: 4px;
  width: max-content;
  background: #08131f;
  border: 3px solid #ffd700;
  border-radius: 7px;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.45);
}

.crossword-cell {
  position: relative;
  width: var(--crossword-cell-size);
  height: var(--crossword-cell-size);
  box-sizing: border-box;
  background: #ffffff;
  border: 1px solid #384553;
  color: #111111;
  cursor: pointer;
}

.crossword-cell.blocked {
  background: #111820;
  border-color: #111820;
  cursor: default;
}

.crossword-cell.selected {
  background: #ffd54f;
}

.crossword-cell.related {
  background: #fff5b5;
}

.crossword-cell.incorrect {
  background: #ffb3b3;
}

.crossword-cell.correct {
  background: #b8e6b8;
}

.crossword-number {
  position: absolute;
  top: 1px;
  left: 2px;
  z-index: 2;
  color: #111111;
  font-size: clamp(0.42rem, 0.9vw, 0.58rem);
  font-weight: 800;
  line-height: 1;
  pointer-events: none;
}

.crossword-input {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  border: none;
  outline: none;
  padding: 5px 1px 1px;
  background: transparent;
  color: #111111;
  text-align: center;
  text-transform: uppercase;
  font-family: inherit;
  font-size: clamp(0.72rem, 1.8vw, 1.2rem);
  font-weight: 800;
  caret-color: transparent;
  cursor: pointer;
}

.crossword-clues {
  width: min(390px, 100%);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.crossword-clues h3 {
  margin: 0 0 8px;
  color: #ffccbc;
  font-size: 1rem;
}

.crossword-clue {
  width: 100%;
  margin: 0 0 7px;
  padding: 7px 8px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  color: #f5f5f5;
  font-family: inherit;
  font-size: 0.84rem;
  line-height: 1.35;
  text-align: left;
  cursor: pointer;
}

.crossword-clue:hover {
  background: #243b57;
}

.crossword-clue.active {
  border-color: #ffd700;
  background: #243b57;
  color: #ffffff;
}

#crossword-message {
  min-height: 24px;
  margin-top: 12px;
  color: #ffebee;
  font-size: 0.92rem;
  font-weight: 700;
  text-align: center;
}

.crossword-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.crossword-control-btn {
  padding: 8px 11px;
  border: 1px solid #ffd700;
  border-radius: 5px;
  background: #33527a;
  color: #ffffff;
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
}

.crossword-control-btn:hover {
  background: #43658f;
}

.crossword-control-btn.reveal {
  border-color: #ff8a80;
}

.crossword-control-btn:focus-visible,
.crossword-clue:focus-visible,
.crossword-input:focus-visible {
  outline: 3px solid #ffd700;
  outline-offset: 2px;
}

@media (max-width: 700px) {
  .crossword-layout {
    flex-direction: column;
    align-items: center;
  }

  #crossword-grid {
    --crossword-cell-size: clamp(16px, 4vw, 23px);
  }

  .crossword-clues {
    grid-template-columns: 1fr;
  }
}

/* Interactive Strands game */

#strands-container {
  margin-top: 20px;
}

.strands-heading {
  margin-bottom: 16px;
  text-align: center;
}

.strands-heading h3 {
  margin-bottom: 7px;
  color: #ffccbc;
}

.strands-theme {
  margin: 5px 0;
  font-size: 1rem;
}

.strands-instructions {
  max-width: 620px;
  margin: 8px auto 0;
  font-size: 0.86rem;
  line-height: 1.5;
  opacity: 0.9;
}

.strands-game-layout {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 28px;
  flex-wrap: wrap;
}

.strands-board-area {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#strands-grid {
  display: grid;
  grid-template-columns: repeat(8, 48px);
  grid-template-rows: repeat(6, 48px);
  gap: 6px;
  padding: 10px;
  border: 2px solid #ffd700;
  border-radius: 12px;
  background: #0b1b2b;
  box-shadow: 0 0 10px rgba(255, 215, 0, 0.45);
  user-select: none;
}

.strands-letter {
  width: 48px;
  height: 48px;
  box-sizing: border-box;
  border: 2px solid #70859b;
  border-radius: 50%;
  background: #e8e6dc;
  color: #111111;
  font-family: inherit;
  font-size: 1.15rem;
  font-weight: 900;
  cursor: pointer;
  transition:
    background-color 0.15s ease,
    border-color 0.15s ease,
    color 0.15s ease,
    transform 0.12s ease;
}

.strands-letter:hover:not(:disabled) {
  border-color: #ffd700;
  transform: scale(1.07);
}

.strands-letter.selected {
  border-color: #ffd700;
  background: #ffd54f;
  color: #111111;
  transform: scale(1.05);
}

.strands-letter.found {
  border-color: #7eb6ff;
  background: #b9d9ff;
  color: #10213a;
}

.strands-letter.spangram {
  border-color: #d6a5ff;
  background: #c99bea;
  color: #26102f;
}

.strands-letter:focus-visible {
  outline: 3px solid #ffffff;
  outline-offset: 2px;
}

#strands-current-word {
  min-height: 28px;
  margin-top: 12px;
  color: #ffd54f;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-align: center;
  text-transform: uppercase;
}

#strands-message {
  min-height: 27px;
  margin: 4px 0 8px;
  font-size: 0.92rem;
  font-weight: 800;
  text-align: center;
}

.strands-message-success {
  color: #b8e6b8;
}

.strands-message-error {
  color: #ffb3b3;
}

.strands-message-hint {
  color: #ffd54f;
}

.strands-controls {
  display: flex;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
}

.strands-control-btn {
  padding: 8px 13px;
  border: 1px solid #ffd700;
  border-radius: 20px;
  background: #243b57;
  color: #ffffff;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
}

.strands-control-btn:hover:not(:disabled) {
  background: #33527a;
}

.strands-control-btn.submit {
  background: #c62828;
}

.strands-control-btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.strands-progress {
  width: min(260px, 100%);
  padding: 14px;

/* Interactive Wordle */
let wordleAnswer = "";
let wordleRow = 0;
let currentGuess = "";
let wordleFinished = false;

const keyboardRows = [
  ["Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P"],
  ["A", "S", "D", "F", "G", "H", "J", "K", "L"],
  ["ENTER", "Z", "X", "C", "V", "B", "N", "M", "BACK"]
];

function startWordle(answer) {
  wordleAnswer = answer.toUpperCase();
  wordleRow = 0;
  currentGuess = "";
  wordleFinished = false;

  const grid = document.getElementById("wordle-grid");
  const keyboard = document.getElementById("wordle-keyboard");
  const message = document.getElementById("wordle-message");

  if (!grid || !keyboard || !message) {
    return;
  }

  grid.innerHTML = "";
  keyboard.innerHTML = "";
  message.textContent = "";

  for (let i = 0; i < 30; i++) {
    const tile = document.createElement("div");

    tile.className = "wordle-tile";
    tile.id = `tile-${i}`;
    tile.setAttribute("role", "gridcell");
    tile.setAttribute("aria-label", `Empty tile ${i + 1}`);

    grid.appendChild(tile);
  }

  createWordleKeyboard();
  updateWordleGrid();
}

function createWordleKeyboard() {
  const keyboard = document.getElementById("wordle-keyboard");

  if (!keyboard) {
    return;
  }

  keyboardRows.forEach((rowLetters) => {
    const row = document.createElement("div");
    row.className = "keyboard-row";

    rowLetters.forEach((letter) => {
      const key = document.createElement("button");

      key.type = "button";
      key.className = "wordle-key";
      key.dataset.key = letter;

      if (letter === "ENTER") {
        key.textContent = "Enter";
        key.classList.add("wide-key");
        key.setAttribute("aria-label", "Submit guess");
      } else if (letter === "BACK") {
        key.textContent = "⌫";
        key.classList.add("wide-key");
        key.setAttribute("aria-label", "Delete letter");
      } else {
        key.textContent = letter;
        key.setAttribute("aria-label", `Letter ${letter}`);
      }

      key.addEventListener("click", () => {
        handleWordleInput(letter);
      });

      row.appendChild(key);
    });

    keyboard.appendChild(row);
  });
}

function handleWordleInput(key) {
  if (wordleFinished) {
    return;
  }

  if (key === "BACK") {
    if (currentGuess.length > 0) {
      currentGuess = currentGuess.slice(0, -1);
      updateWordleGrid();
      setWordleMessage("");
    }

    return;
  }

  if (key === "ENTER") {
    submitWordleGuess();
    return;
  }

  if (/^[A-Z]$/.test(key) && currentGuess.length < 5) {
    currentGuess += key;
    updateWordleGrid();
    setWordleMessage("");
  }
}

function updateWordleGrid() {
  for (let column = 0; column < 5; column++) {
    const tileIndex = wordleRow * 5 + column;
    const tile = document.getElementById(`tile-${tileIndex}`);

    if (!tile) {
      continue;
    }

    const letter = currentGuess[column] || "";

    tile.textContent = letter;
    tile.classList.toggle("filled", Boolean(letter));

    if (letter) {
      tile.setAttribute(
        "aria-label",
        `Row ${wordleRow + 1}, column ${column + 1}, letter ${letter}`
      );
    } else {
      tile.setAttribute(
        "aria-label",
        `Row ${wordleRow + 1}, column ${column + 1}, empty`
      );
    }
  }
}

function submitWordleGuess() {
  if (currentGuess.length !== 5) {
    setWordleMessage("Enter five letters before pressing Enter.");
    return;
  }

  const result = scoreWordleGuess(currentGuess, wordleAnswer);

  for (let column = 0; column < 5; column++) {
    const tileIndex = wordleRow * 5 + column;
    const tile = document.getElementById(`tile-${tileIndex}`);

    if (!tile) {
      continue;
    }

    tile.classList.remove("filled");
    tile.classList.add(`wordle-${result[column]}`);

    tile.setAttribute(
      "aria-label",
      `${currentGuess[column]}, ${result[column]}`
    );

    updateKeyboardLetter(currentGuess[column], result[column]);
  }

  if (currentGuess === wordleAnswer) {
    setWordleMessage("🎉 Correct!");
    wordleFinished = true;
    return;
  }

  wordleRow++;

  if (wordleRow >= 6) {
    setWordleMessage(`❄ The word was ${wordleAnswer}.`);
    wordleFinished = true;
    return;
  }

  currentGuess = "";
  setWordleMessage(`Guess ${wordleRow + 1} of 6`);
}

function scoreWordleGuess(guess, answer) {
  const result = Array(5).fill("absent");
  const remainingLetters = {};
  const normalizedGuess = guess.toUpperCase();
  const normalizedAnswer = answer.toUpperCase();

  /*
    First pass:
    Identify letters in the correct position.
    Count unmatched answer letters for the yellow-letter pass.
  */
  for (let i = 0; i < 5; i++) {
    if (normalizedGuess[i] === normalizedAnswer[i]) {
      result[i] = "correct";
    } else {
      const answerLetter = normalizedAnswer[i];

      remainingLetters[answerLetter] =
        (remainingLetters[answerLetter] || 0) + 1;
    }
  }

  /*
    Second pass:
    Mark a letter yellow only when an unmatched copy of that
    letter remains in the answer.
  */
  for (let i = 0; i < 5; i++) {
    if (result[i] === "correct") {
      continue;
    }

    const guessLetter = normalizedGuess[i];

    if (remainingLetters[guessLetter] > 0) {
      result[i] = "present";
      remainingLetters[guessLetter]--;
    }
  }

  return result;
}

function updateKeyboardLetter(letter, status) {
  const key = document.querySelector(
    `.wordle-key[data-key="${letter}"]`
  );

  if (!key) {
    return;
  }

  /*
    A green keyboard key must never be downgraded to yellow or gray.
    A yellow key must never be downgraded to gray.
  */
  if (key.classList.contains("key-correct")) {
    return;
  }

  if (
    key.classList.contains("key-present") &&
    status === "absent"
  ) {
    return;
  }

  key.classList.remove(
    "key-correct",
    "key-present",
    "key-absent"
  );

  key.classList.add(`key-${status}`);

  if (status === "correct") {
    key.setAttribute(
      "aria-label",
      `Letter ${letter}, correct position`
    );
  } else if (status === "present") {
    key.setAttribute(
      "aria-label",
      `Letter ${letter}, in the word`
    );
  } else {
    key.setAttribute(
      "aria-label",
      `Letter ${letter}, not in the word`
    );
  }
}

function setWordleMessage(message) {
  const messageElement = document.getElementById("wordle-message");

  if (messageElement) {
    messageElement.textContent = message;
  }
}

document.addEventListener("keydown", function (event) {
  const wordleContainer =
    document.getElementById("wordle-container");

  if (!wordleContainer || wordleFinished) {
    return;
  }

  if (event.key === "Enter") {
    event.preventDefault();
    handleWordleInput("ENTER");
    return;
  }

  if (event.key === "Backspace") {
    event.preventDefault();
    handleWordleInput("BACK");
    return;
  }

  if (/^[a-zA-Z]$/.test(event.key)) {
    handleWordleInput(event.key.toUpperCase());
  }
});


/* Interactive mini crossword */
let crosswordPuzzle = null;
let crosswordEntries = [];
let crosswordCellEntries = new Map();
let crosswordSelectedCell = null;
let crosswordDirection = "across";
let crosswordActiveEntry = null;
let crosswordFinished = false;

function startCrossword(puzzle) {
  crosswordPuzzle = puzzle;
  crosswordEntries = [];
  crosswordCellEntries = new Map();
  crosswordSelectedCell = null;
  crosswordDirection = "across";
  crosswordActiveEntry = null;
  crosswordFinished = false;

  const grid = document.getElementById("crossword-grid");
  const acrossContainer =
    document.getElementById("crossword-across-clues");
  const downContainer =
    document.getElementById("crossword-down-clues");
  const message =
    document.getElementById("crossword-message");

  if (!grid || !acrossContainer || !downContainer || !message) {
    return;
  }

  grid.innerHTML = "";
  acrossContainer.innerHTML = "";
  downContainer.innerHTML = "";
  message.textContent = "";

  crosswordEntries = [
    ...puzzle.across.map((entry) => ({
      ...entry,
      direction: "across"
    })),

    ...puzzle.down.map((entry) => ({
      ...entry,
      direction: "down"
    }))
  ];

  buildCrosswordEntryMap();
  buildCrosswordGrid();
  buildCrosswordClues(
    puzzle.across,
    acrossContainer,
    "across"
  );
  buildCrosswordClues(
    puzzle.down,
    downContainer,
    "down"
  );

  const firstAcross = crosswordEntries.find(
    (entry) => entry.direction === "across"
  );

  if (firstAcross) {
    selectCrosswordEntry(firstAcross);
  }
}

function cellKey(row, col) {
  return `${row}-${col}`;
}

function getEntryCells(entry) {
  return entry.answer.split("").map((letter, index) => ({
    row:
      entry.direction === "down"
        ? entry.row + index
        : entry.row,

    col:
      entry.direction === "across"
        ? entry.col + index
        : entry.col,

    letter
  }));
}

function buildCrosswordEntryMap() {
  crosswordEntries.forEach((entry) => {
    getEntryCells(entry).forEach(({ row, col }) => {
      const key = cellKey(row, col);

      if (!crosswordCellEntries.has(key)) {
        crosswordCellEntries.set(key, []);
      }

      crosswordCellEntries.get(key).push(entry);
    });
  });
}

function getCellNumber(row, col) {
  const startingEntries = crosswordEntries.filter(
    (entry) => entry.row === row && entry.col === col
  );

  if (startingEntries.length === 0) {
    return "";
  }

  return Math.min(
    ...startingEntries.map((entry) => entry.number)
  );
}

function buildCrosswordGrid() {
  const grid = document.getElementById("crossword-grid");

  if (!grid || !crosswordPuzzle) {
    return;
  }

  grid.innerHTML = "";

  grid.style.setProperty(
    "--crossword-size",
    crosswordPuzzle.size
  );

  for (let row = 0; row < crosswordPuzzle.size; row++) {
    for (let col = 0; col < crosswordPuzzle.size; col++) {
      const solutionLetter =
        crosswordPuzzle.grid[row][col];

      const cell = document.createElement("div");
      cell.className = "crossword-cell";
      cell.dataset.row = row;
      cell.dataset.col = col;

      if (solutionLetter === null) {
        cell.classList.add("blocked");
        cell.setAttribute("aria-hidden", "true");
        grid.appendChild(cell);
        continue;
      }

      const number = getCellNumber(row, col);

      if (number !== "") {
        const numberElement =
          document.createElement("span");

        numberElement.className = "crossword-number";
        numberElement.textContent = number;

        cell.appendChild(numberElement);
      }

      const input = document.createElement("input");

      input.className = "crossword-input";
      input.id = `crossword-${row}-${col}`;
      input.type = "text";
      input.inputMode = "text";
      input.maxLength = 1;
      input.autocomplete = "off";
      input.spellcheck = false;

      input.setAttribute(
        "aria-label",
        `Crossword row ${row + 1}, column ${col + 1}`
      );

      input.addEventListener("focus", () => {
        selectCrosswordCell(row, col, false);
      });

      input.addEventListener("click", () => {
        selectCrosswordCell(row, col, true);
      });

      input.addEventListener("keydown", (event) => {
        handleCrosswordKeydown(event, row, col);
      });

      input.addEventListener("input", (event) => {
        handleCrosswordLetter(event, row, col);
      });

      cell.appendChild(input);
      grid.appendChild(cell);
    }
  }
}

function buildCrosswordClues(entries, container, direction) {
  entries.forEach((entry) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "crossword-clue";
    button.dataset.number = entry.number;
    button.dataset.direction = direction;
    button.innerHTML =
      `<strong>${entry.number}.</strong> ${entry.clue}`;

    button.addEventListener("click", () => {
      const fullEntry = crosswordEntries.find(
        (candidate) =>
          candidate.number === entry.number &&
          candidate.direction === direction
      );

      if (fullEntry) {
        selectCrosswordEntry(fullEntry);
      }
    });

    container.appendChild(button);
  });
}

function selectCrosswordCell(row, col, allowDirectionToggle) {
  if (crosswordFinished) {
    return;
  }

  const key = cellKey(row, col);
  const entries = crosswordCellEntries.get(key) || [];

  if (entries.length === 0) {
    return;
  }

  const isSameCell =
    crosswordSelectedCell &&
    crosswordSelectedCell.row === row &&
    crosswordSelectedCell.col === col;

  if (allowDirectionToggle && isSameCell && entries.length > 1) {
    const otherEntry = entries.find(
      (entry) => entry.direction !== crosswordDirection
    );

    if (otherEntry) {
      crosswordDirection = otherEntry.direction;
      crosswordActiveEntry = otherEntry;
    }
  } else {
    const preferredEntry = entries.find(
      (entry) => entry.direction === crosswordDirection
    );

    crosswordActiveEntry = preferredEntry || entries[0];
    crosswordDirection = crosswordActiveEntry.direction;
  }

  crosswordSelectedCell = { row, col };

  highlightCrosswordSelection();
}

function selectCrosswordEntry(entry) {
  crosswordActiveEntry = entry;
  crosswordDirection = entry.direction;
  crosswordSelectedCell = {
    row: entry.row,
    col: entry.col
  };

  highlightCrosswordSelection();

  const input = document.getElementById(
    `crossword-${entry.row}-${entry.col}`
  );

  if (input) {
    input.focus();
  }
}

function highlightCrosswordSelection() {
  document
    .querySelectorAll(".crossword-cell")
    .forEach((cell) => {
      cell.classList.remove("selected", "related");
    });

  document
    .querySelectorAll(".crossword-clue")
    .forEach((clue) => {
      clue.classList.remove("active");
    });

  if (!crosswordActiveEntry || !crosswordSelectedCell) {
    return;
  }

  getEntryCells(crosswordActiveEntry).forEach(({ row, col }) => {
    const input = document.getElementById(
      `crossword-${row}-${col}`
    );

    if (input) {
      input.parentElement.classList.add("related");
    }
  });

  const selectedInput = document.getElementById(
    `crossword-${crosswordSelectedCell.row}-${crosswordSelectedCell.col}`
  );

  if (selectedInput) {
    selectedInput.parentElement.classList.remove("related");
    selectedInput.parentElement.classList.add("selected");
  }

  const activeClue = document.querySelector(
    `.crossword-clue[data-number="${crosswordActiveEntry.number}"]` +
    `[data-direction="${crosswordActiveEntry.direction}"]`
  );

  if (activeClue) {
    activeClue.classList.add("active");
  }
}

function handleCrosswordLetter(event, row, col) {
  if (crosswordFinished) {
    return;
  }

  const input = event.target;
  const cleanedValue = input.value
    .replace(/[^a-zA-Z]/g, "")
    .slice(-1)
    .toUpperCase();

  input.value = cleanedValue;

  input.parentElement.classList.remove(
    "incorrect",
    "correct"
  );

  if (cleanedValue) {
    moveToNextCrosswordCell(row, col);
  }

  setCrosswordMessage("");
}

function handleCrosswordKeydown(event, row, col) {
  if (crosswordFinished) {
    event.preventDefault();
    return;
  }

  if (event.key === "Backspace") {
    const currentInput = event.target;

    if (currentInput.value) {
      currentInput.value = "";
      currentInput.parentElement.classList.remove(
        "incorrect",
        "correct"
      );
    } else {
      moveToPreviousCrosswordCell(row, col, true);
    }

    event.preventDefault();
    return;
  }

  if (event.key === "ArrowRight") {
    moveToAdjacentOpenCell(row, col, 0, 1);
    event.preventDefault();
  } else if (event.key === "ArrowLeft") {
    moveToAdjacentOpenCell(row, col, 0, -1);
    event.preventDefault();
  } else if (event.key === "ArrowDown") {
    moveToAdjacentOpenCell(row, col, 1, 0);
    event.preventDefault();
  } else if (event.key === "ArrowUp") {
    moveToAdjacentOpenCell(row, col, -1, 0);
    event.preventDefault();
  } else if (event.key === "Enter") {
    switchCrosswordDirection(row, col);
    event.preventDefault();
  } else if (
    event.key.length === 1 &&
    !/^[a-zA-Z]$/.test(event.key)
  ) {
    event.preventDefault();
  }
}

function getActiveEntryCellIndex(row, col) {
  if (!crosswordActiveEntry) {
    return -1;
  }

  return getEntryCells(crosswordActiveEntry).findIndex(
    (cell) => cell.row === row && cell.col === col
  );
}

function moveToNextCrosswordCell(row, col) {
  if (!crosswordActiveEntry) {
    return;
  }

  const cells = getEntryCells(crosswordActiveEntry);
  const index = getActiveEntryCellIndex(row, col);

  if (index >= 0 && index < cells.length - 1) {
    focusCrosswordCell(
      cells[index + 1].row,
      cells[index + 1].col
    );
  }
}

function moveToPreviousCrosswordCell(row, col, erasePrevious) {
  if (!crosswordActiveEntry) {
    return;
  }

  const cells = getEntryCells(crosswordActiveEntry);
  const index = getActiveEntryCellIndex(row, col);

  if (index > 0) {
    const previous = cells[index - 1];
    const previousInput = document.getElementById(
      `crossword-${previous.row}-${previous.col}`
    );

    if (previousInput) {
      if (erasePrevious) {
        previousInput.value = "";
        previousInput.parentElement.classList.remove(
          "incorrect",
          "correct"
        );
      }

      focusCrosswordCell(previous.row, previous.col);
    }
  }
}

function moveToAdjacentOpenCell(
  row,
  col,
  rowOffset,
  colOffset
) {
  let nextRow = row + rowOffset;
  let nextCol = col + colOffset;

  while (
    nextRow >= 0 &&
    nextRow < crosswordPuzzle.size &&
    nextCol >= 0 &&
    nextCol < crosswordPuzzle.size
  ) {
    if (crosswordPuzzle.grid[nextRow][nextCol] !== null) {
      if (rowOffset !== 0) {
        crosswordDirection = "down";
      } else {
        crosswordDirection = "across";
      }

      focusCrosswordCell(nextRow, nextCol);
      return;
    }

    nextRow += rowOffset;
    nextCol += colOffset;
  }
}

function focusCrosswordCell(row, col) {
  const input = document.getElementById(
    `crossword-${row}-${col}`
  );

  if (input) {
    selectCrosswordCell(row, col, false);
    input.focus();
  }
}

function switchCrosswordDirection(row, col) {
  selectCrosswordCell(row, col, true);
}

function checkCrossword() {
  if (!crosswordPuzzle || crosswordFinished) {
    return;
  }

  let openCellCount = 0;
  let filledCellCount = 0;
  let correctCellCount = 0;

  for (let row = 0; row < crosswordPuzzle.size; row++) {
    for (let col = 0; col < crosswordPuzzle.size; col++) {
      const expected = crosswordPuzzle.grid[row][col];

      if (expected === null) {
        continue;
      }

      openCellCount++;

      const input = document.getElementById(
        `crossword-${row}-${col}`
      );

      if (!input) {
        continue;
      }

      const entered = input.value.toUpperCase();
      const cell = input.parentElement;

      cell.classList.remove("incorrect", "correct");

      if (!entered) {
        continue;
      }

      filledCellCount++;

      if (entered === expected.toUpperCase()) {
        correctCellCount++;
        cell.classList.add("correct");
      } else {
        cell.classList.add("incorrect");
      }
    }
  }

  if (correctCellCount === openCellCount) {
    crosswordFinished = true;
    setCrosswordMessage("🎉 Crossword complete!");
    lockCrosswordInputs();
  } else if (filledCellCount < openCellCount) {
    setCrosswordMessage(
      "Keep going. Some squares are still empty."
    );
  } else {
    setCrosswordMessage(
      "Some letters need another look."
    );
  }
}

function clearCrossword() {
  if (!crosswordPuzzle) {
    return;
  }

  document
    .querySelectorAll(".crossword-input")
    .forEach((input) => {
      input.value = "";
      input.disabled = false;
      input.parentElement.classList.remove(
        "incorrect",
        "correct"
      );
    });

  crosswordFinished = false;
  setCrosswordMessage("");

  const firstEntry = crosswordEntries.find(
    (entry) => entry.direction === "across"
  );

  if (firstEntry) {
    selectCrosswordEntry(firstEntry);
  }
}

function revealCrossword() {
  if (!crosswordPuzzle) {
    return;
  }

  const confirmed = window.confirm(
    "Reveal the complete crossword solution?"
  );

  if (!confirmed) {
    return;
  }

  for (let row = 0; row < crosswordPuzzle.size; row++) {
    for (let col = 0; col < crosswordPuzzle.size; col++) {
      const expected = crosswordPuzzle.grid[row][col];

      if (expected === null) {
        continue;
      }

      const input = document.getElementById(
        `crossword-${row}-${col}`
      );

      if (input) {
        input.value = expected;
        input.parentElement.classList.remove("incorrect");
        input.parentElement.classList.add("correct");
      }
    }
  }

  crosswordFinished = true;
  setCrosswordMessage("Puzzle revealed.");
  lockCrosswordInputs();
}

function lockCrosswordInputs() {
  document
    .querySelectorAll(".crossword-input")
    .forEach((input) => {
      input.disabled = true;
    });
}

function setCrosswordMessage(message) {
  const messageElement =
    document.getElementById("crossword-message");

  if (messageElement) {
    messageElement.textContent = message;
  }
}

/* Interactive Connections game */

let connectionsGroups = [];
let connectionsWords = [];
let connectionsSelected = new Set();
let connectionsSolved = new Set();
let connectionsMistakesRemaining = 4;
let connectionsGameOver = false;

function startConnections(game) {
  connectionsGroups = game.groups.map((group, groupIndex) => ({
    ...group,
    id: groupIndex
  }));

  connectionsWords = [];

  connectionsGroups.forEach((group) => {
    group.words.forEach((word) => {
      connectionsWords.push({
        word,
        groupId: group.id
      });
    });
  });

  connectionsWords = shuffleArray(connectionsWords);

  connectionsSelected = new Set();
  connectionsSolved = new Set();
  connectionsMistakesRemaining = 4;
  connectionsGameOver = false;

  setConnectionsMessage("");
  renderConnectionsGame();
}

function shuffleArray(items) {
  const shuffled = [...items];

  for (let i = shuffled.length - 1; i > 0; i--) {
    const randomIndex =
      Math.floor(Math.random() * (i + 1));

    [shuffled[i], shuffled[randomIndex]] =
      [shuffled[randomIndex], shuffled[i]];
  }

  return shuffled;
}

function renderConnectionsGame() {
  const solvedContainer =
    document.getElementById("connections-solved");

  const grid =
    document.getElementById("connections-grid");

  if (!solvedContainer || !grid) {
    return;
  }

  solvedContainer.innerHTML = "";
  grid.innerHTML = "";

  connectionsGroups.forEach((group) => {
    if (!connectionsSolved.has(group.id)) {
      return;
    }

    const solvedGroup = document.createElement("div");

    solvedGroup.className =
      `connections-solved-group connections-${group.color}`;

    const category = document.createElement("div");
    category.className = "connections-solved-category";
    category.textContent = group.category;

    const words = document.createElement("div");
    words.className = "connections-solved-words";
    words.textContent = group.words.join(", ");

    solvedGroup.appendChild(category);
    solvedGroup.appendChild(words);
    solvedContainer.appendChild(solvedGroup);
  });

  const remainingWords = connectionsWords.filter(
    (item) => !connectionsSolved.has(item.groupId)
  );

  remainingWords.forEach((item) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "connections-word";
    button.textContent = item.word;
    button.dataset.word = item.word;

    if (connectionsSelected.has(item.word)) {
      button.classList.add("selected");
      button.setAttribute("aria-pressed", "true");
    } else {
      button.setAttribute("aria-pressed", "false");
    }

    button.disabled = connectionsGameOver;

    button.addEventListener("click", () => {
      toggleConnectionsWord(item.word);
    });

    grid.appendChild(button);
  });

  renderConnectionsMistakes();
  updateConnectionsSubmitButton();
}

function toggleConnectionsWord(word) {
  if (connectionsGameOver) {
    return;
  }

  if (connectionsSelected.has(word)) {
    connectionsSelected.delete(word);
    setConnectionsMessage("");
    renderConnectionsGame();
    return;
  }

  if (connectionsSelected.size >= 4) {
    setConnectionsMessage(
      "You can select only four words.",
      "error"
    );

    return;
  }

  connectionsSelected.add(word);
  setConnectionsMessage("");
  renderConnectionsGame();
}

function updateConnectionsSubmitButton() {
  const submitButton =
    document.getElementById("connections-submit");

  if (!submitButton) {
    return;
  }

  submitButton.disabled =
    connectionsSelected.size !== 4 ||
    connectionsGameOver;
}

function submitConnectionsGuess() {
  if (
    connectionsGameOver ||
    connectionsSelected.size !== 4
  ) {
    return;
  }

  const selectedWords =
    Array.from(connectionsSelected);

  const matchingGroup = connectionsGroups.find(
    (group) =>
      !connectionsSolved.has(group.id) &&
      selectedWords.every(
        (word) => group.words.includes(word)
      )
  );

  if (matchingGroup) {
    connectionsSolved.add(matchingGroup.id);
    connectionsSelected.clear();

    setConnectionsMessage(
      `Correct: ${matchingGroup.category}`,
      "success"
    );

    renderConnectionsGame();

    if (
      connectionsSolved.size === connectionsGroups.length
    ) {
      connectionsGameOver = true;

      setConnectionsMessage(
        "🎉 You solved all four groups!",
        "success"
      );

      renderConnectionsGame();
    }

    return;
  }

  const oneAway = connectionsGroups.some((group) => {
    if (connectionsSolved.has(group.id)) {
      return false;
    }

    const matchingWordCount =
      selectedWords.filter(
        (word) => group.words.includes(word)
      ).length;

    return matchingWordCount === 3;
  });

  connectionsMistakesRemaining--;
  connectionsSelected.clear();

  if (connectionsMistakesRemaining <= 0) {
    connectionsGameOver = true;

    revealConnectionsGroups();

    setConnectionsMessage(
      "No mistakes remaining. The remaining groups have been revealed.",
      "error"
    );

    return;
  }

  if (oneAway) {
    setConnectionsMessage(
      "One away! Three of your four words belong together.",
      "close"
    );
  } else {
    setConnectionsMessage(
      "Not quite. Try a different combination.",
      "error"
    );
  }

  renderConnectionsGame();
}

function deselectConnections() {
  if (connectionsGameOver) {
    return;
  }

  connectionsSelected.clear();
  setConnectionsMessage("");
  renderConnectionsGame();
}

function shuffleConnections() {
  if (connectionsGameOver) {
    return;
  }

  const unsolvedWords = connectionsWords.filter(
    (item) => !connectionsSolved.has(item.groupId)
  );

  const solvedWords = connectionsWords.filter(
    (item) => connectionsSolved.has(item.groupId)
  );

  connectionsWords = [
    ...shuffleArray(unsolvedWords),
    ...solvedWords
  ];

  setConnectionsMessage("");
  renderConnectionsGame();
}

function revealConnectionsGroups() {
  connectionsGroups.forEach((group) => {
    connectionsSolved.add(group.id);
  });

  connectionsSelected.clear();
  renderConnectionsGame();

  document
    .querySelectorAll(".connections-solved-group")
    .forEach((groupElement) => {
      groupElement.classList.add("connections-revealed");
    });
}

function renderConnectionsMistakes() {
  const mistakeContainer =
    document.getElementById(
      "connections-mistake-dots"
    );

  if (!mistakeContainer) {
    return;
  }

  mistakeContainer.innerHTML = "";

  for (
    let index = 0;
    index < connectionsMistakesRemaining;
    index++
  ) {
    const dot = document.createElement("span");
    dot.className = "connections-mistake-dot";

    dot.setAttribute(
      "aria-label",
      "Mistake remaining"
    );

    mistakeContainer.appendChild(dot);
  }
}

function setConnectionsMessage(
  message,
  type = ""
) {
  const messageElement =
    document.getElementById("connections-message");

  if (!messageElement) {
    return;
  }

  messageElement.textContent = message;

  messageElement.classList.remove(
    "connections-message-close",
    "connections-message-success",
    "connections-message-error"
  );

  if (type === "close") {
    messageElement.classList.add(
      "connections-message-close"
    );
  } else if (type === "success") {
    messageElement.classList.add(
      "connections-message-success"
    );
  } else if (type === "error") {
    messageElement.classList.add(
      "connections-message-error"
    );
  }
}

/* Interactive Strands game */

let strandsGame = null;
let strandsBoard = [];
let strandsSelectedPath = [];
let strandsWordPaths = new Map();
let strandsFoundWords = new Set();
let strandsIncorrectAttempts = 0;
let strandsFinished = false;

const STRANDS_ROWS = 6;
const STRANDS_COLUMNS = 8;

function startStrands(game) {
  strandsGame = {
    ...game,
    spangram: normalizeStrandsWord(game.spangram),
    words: game.words.map(normalizeStrandsWord)
  };

  strandsSelectedPath = [];
  strandsWordPaths = new Map();
  strandsFoundWords = new Set();
  strandsIncorrectAttempts = 0;
  strandsFinished = false;

  buildStrandsBoard();
  renderStrandsBoard();
  renderStrandsProgress();
  updateStrandsSelectionDisplay();

  setStrandsMessage("");
}

function normalizeStrandsWord(word) {
  return word
    .toUpperCase()
    .replace(/[^A-Z]/g, "");
}

function getAllStrandsAnswers() {
  return [
    strandsGame.spangram,
    ...strandsGame.words
  ];
}

function buildStrandsBoard() {
  const answers = getAllStrandsAnswers();
  const combinedLetters = answers.join("");

  if (
    combinedLetters.length !==
    STRANDS_ROWS * STRANDS_COLUMNS
  ) {
    console.error(
      "Strands board must contain exactly 48 letters.",
      combinedLetters.length
    );

    setStrandsMessage(
      "This Strands puzzle does not contain exactly 48 letters.",
      "error"
    );

    return;
  }

  const snakeCoordinates = [];

  for (let row = 0; row < STRANDS_ROWS; row++) {
    const columns = [];

    for (
      let col = 0;
      col < STRANDS_COLUMNS;
      col++
    ) {
      columns.push(col);
    }

    if (row % 2 === 1) {
      columns.reverse();
    }

    columns.forEach((col) => {
      snakeCoordinates.push({ row, col });
    });
  }

  strandsBoard = Array.from(
    { length: STRANDS_ROWS },
    () => Array(STRANDS_COLUMNS).fill("")
  );

  let letterIndex = 0;

  answers.forEach((answer) => {
    const path = [];

    answer.split("").forEach((letter) => {
      const coordinate =
        snakeCoordinates[letterIndex];

      strandsBoard[coordinate.row][coordinate.col] =
        letter;

      path.push({
        row: coordinate.row,
        col: coordinate.col
      });

      letterIndex++;
    });

    strandsWordPaths.set(answer, path);
  });
}

function renderStrandsBoard() {
  const grid =
    document.getElementById("strands-grid");

  if (!grid) {
    return;
  }

  grid.innerHTML = "";

  for (let row = 0; row < STRANDS_ROWS; row++) {
    for (
      let col = 0;
      col < STRANDS_COLUMNS;
      col++
    ) {
      const button =
        document.createElement("button");

      button.type = "button";
      button.className = "strands-letter";
      button.textContent = strandsBoard[row][col];

      button.dataset.row = row;
      button.dataset.col = col;

      button.setAttribute(
        "aria-label",
        `Row ${row + 1}, column ${col + 1}, ` +
        `letter ${strandsBoard[row][col]}`
      );

      applyStrandsCellState(button, row, col);

      button.addEventListener("click", () => {
        selectStrandsLetter(row, col);
      });

      grid.appendChild(button);
    }
  }
}

function applyStrandsCellState(button, row, col) {
  const selectedIndex =
    strandsSelectedPath.findIndex(
      (cell) =>
        cell.row === row &&
        cell.col === col
    );

  if (selectedIndex >= 0) {
    button.classList.add("selected");
  }

  strandsFoundWords.forEach((word) => {
    const path = strandsWordPaths.get(word) || [];

    const belongsToWord = path.some(
      (cell) =>
        cell.row === row &&
        cell.col === col
    );

    if (!belongsToWord) {
      return;
    }

    if (word === strandsGame.spangram) {
      button.classList.add("spangram");
    } else {
      button.classList.add("found");
    }

    button.disabled = true;
  });
}

function selectStrandsLetter(row, col) {
  if (strandsFinished) {
    return;
  }

  const existingIndex =
    strandsSelectedPath.findIndex(
      (cell) =>
        cell.row === row &&
        cell.col === col
    );

  /*
    Clicking the most recently selected letter removes it.
  */
  if (
  strandsSelectedPath.length > 0 &&
  existingIndex ===
    strandsSelectedPath.length - 1
) {
  strandsSelectedPath.pop();
  setStrandsMessage("");
  renderStrandsBoard();
  updateStrandsSelectionDisplay();
  return;
}

  /*
    A cell already used earlier in the current path
    cannot be selected again.
  */
  if (existingIndex >= 0) {
    setStrandsMessage(
      "That letter is already in your current path.",
      "error"
    );

    return;
  }

  if (strandsSelectedPath.length > 0) {
    const previous =
      strandsSelectedPath[
        strandsSelectedPath.length - 1
      ];

    if (
      !areStrandsCellsAdjacent(
        previous,
        { row, col }
      )
    ) {
      setStrandsMessage(
        "Select a letter next to the previous one.",
        "error"
      );

      return;
    }
  }

  strandsSelectedPath.push({ row, col });

  setStrandsMessage("");
  renderStrandsBoard();
  updateStrandsSelectionDisplay();
}

function areStrandsCellsAdjacent(first, second) {
  const rowDifference =
    Math.abs(first.row - second.row);

  const columnDifference =
    Math.abs(first.col - second.col);

  return (
    rowDifference <= 1 &&
    columnDifference <= 1 &&
    !(rowDifference === 0 && columnDifference === 0)
  );
}

function getCurrentStrandsWord() {
  return strandsSelectedPath
    .map(
      (cell) =>
        strandsBoard[cell.row][cell.col]
    )
    .join("");
}

function updateStrandsSelectionDisplay() {
  const currentWordElement =
    document.getElementById(
      "strands-current-word"
    );

  const submitButton =
    document.getElementById(
      "strands-submit"
    );

  const currentWord = getCurrentStrandsWord();

  if (currentWordElement) {
    currentWordElement.textContent =
      currentWord || "Select a letter";
  }

  if (submitButton) {
    submitButton.disabled =
      currentWord.length < 3 ||
      strandsFinished;
  }
}

function submitStrandsWord() {
  if (strandsFinished) {
    return;
  }

  const submittedWord =
    getCurrentStrandsWord();

  const reversedWord =
    submittedWord
      .split("")
      .reverse()
      .join("");

  const answers = getAllStrandsAnswers();

  const matchingWord = answers.find(
    (answer) =>
      answer === submittedWord ||
      answer === reversedWord
  );

  if (
    matchingWord &&
    !strandsFoundWords.has(matchingWord)
  ) {
    strandsFoundWords.add(matchingWord);

    setStrandsMessage(
      matchingWord === strandsGame.spangram
        ? "✨ Spangram found!"
        : `Found: ${matchingWord}`,
      "success"
    );

    strandsSelectedPath = [];

    renderStrandsBoard();
    renderStrandsProgress();
    updateStrandsSelectionDisplay();

    if (
      strandsFoundWords.size ===
      answers.length
    ) {
      strandsFinished = true;

      setStrandsMessage(
        "🎉 You found every theme word and the spangram!",
        "success"
      );

      updateStrandsSelectionDisplay();
    }

    return;
  }

  if (matchingWord) {
    setStrandsMessage(
      "You already found that word.",
      "error"
    );
  } else {
    strandsIncorrectAttempts++;

    if (
      strandsIncorrectAttempts % 3 === 0
    ) {
      setStrandsMessage(
        "Hint earned! Select Hint to reveal the starting letter of an unfound word.",
        "hint"
      );
    } else {
      setStrandsMessage(
        "That is not one of today's theme words.",
        "error"
      );
    }
  }

  strandsSelectedPath = [];
  renderStrandsBoard();
  updateStrandsSelectionDisplay();
}

function clearStrandsSelection() {
  if (strandsFinished) {
    return;
  }

  strandsSelectedPath = [];
  setStrandsMessage("");
  renderStrandsBoard();
  updateStrandsSelectionDisplay();
}

function showStrandsHint() {
  if (!strandsGame || strandsFinished) {
    return;
  }

  const unfoundWord =
    getAllStrandsAnswers().find(
      (word) =>
        !strandsFoundWords.has(word)
    );

  if (!unfoundWord) {
    return;
  }

  const path =
    strandsWordPaths.get(unfoundWord);

  if (!path || path.length === 0) {
    return;
  }

  const firstCell = path[0];

  strandsSelectedPath = [firstCell];

  setStrandsMessage(
    strandsGame.hint +
    ` Start with the letter ${unfoundWord[0]}.`,
    "hint"
  );

  renderStrandsBoard();
  updateStrandsSelectionDisplay();
}

function renderStrandsProgress() {
  const foundContainer =
    document.getElementById(
      "strands-found-words"
    );

  const foundCount =
    document.getElementById(
      "strands-found-count"
    );

  const totalCount =
    document.getElementById(
      "strands-total-count"
    );

  const spangramLabel =
    document.getElementById(
      "strands-spangram-label"
    );

  if (
    !foundContainer ||
    !foundCount ||
    !totalCount ||
    !spangramLabel
  ) {
    return;
  }

  foundContainer.innerHTML = "";

  strandsFoundWords.forEach((word) => {
    const wordElement =
      document.createElement("div");

    wordElement.className =
      "strands-found-word";

    if (word === strandsGame.spangram) {
      wordElement.classList.add("spangram");
      wordElement.textContent =
        `${word} · SPANGRAM`;
    } else {
      wordElement.textContent = word;
    }

    foundContainer.appendChild(wordElement);
  });

  foundCount.textContent =
    strandsFoundWords.size;

  totalCount.textContent =
    getAllStrandsAnswers().length;

  spangramLabel.textContent =
    strandsFoundWords.has(
      strandsGame.spangram
    )
      ? strandsGame.spangram
      : "Not found";
}

function setStrandsMessage(
  message,
  type = ""
) {
  const messageElement =
    document.getElementById(
      "strands-message"
    );

  if (!messageElement) {
    return;
  }

  messageElement.textContent = message;

  messageElement.classList.remove(
    "strands-message-success",
    "strands-message-error",
    "strands-message-hint"
  );

  if (type === "success") {
    messageElement.classList.add(
      "strands-message-success"
    );
  } else if (type === "error") {
    messageElement.classList.add(
      "strands-message-error"
    );
  } else if (type === "hint") {
    messageElement.classList.add(
      "strands-message-hint"
    );
  }
}

createSnow();


// Phone-friendly navigation: left/right keys and horizontal swipe on the activity area.
document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowLeft") changeDay(-1);
  if (event.key === "ArrowRight") changeDay(1);
});
let touchStartX = null;
const activity = document.getElementById("content");
activity.addEventListener("touchstart", (event) => {
  touchStartX = event.changedTouches[0].clientX;
}, { passive: true });
activity.addEventListener("touchend", (event) => {
  if (touchStartX === null) return;
  const distance = event.changedTouches[0].clientX - touchStartX;
  touchStartX = null;
  if (Math.abs(distance) > 80) changeDay(distance > 0 ? -1 : 1);
}, { passive: true });

// Load Day 1 automatically
showDay(1);

</script>
